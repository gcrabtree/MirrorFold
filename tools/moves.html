<!doctype html>
<meta charset="utf-8">
<title>Mirrorfold: the dancers' moves</title>
<!-- Every move, dancing in a loop, to look at before keeping one. Serve the folder (python3 -m http.server) and open
     /tools/moves.html. It uses the app's own js/moves.js and js/dance.js, so what is seen is what the figures do,
     less what a figure adds of its own (the sway, the give of the knees to the kick, its manner). Choose a kind,
     a speed, and whether the moves are turned the other way; click a move to see it large with its numbers. A move
     whose fastest joint goes over six figure heights a second at this speed is marked. -->
<style>
body{margin:0;background:#111;color:#ddd;font:14px sans-serif}
#bar{position:sticky;top:0;background:#1b1b1f;padding:8px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:2}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:8px}
.cell{background:#18181c;border-radius:6px;padding:4px;cursor:pointer;text-align:center}
.cell.big{grid-column:span 3;grid-row:span 3}
.cell canvas{width:100%;display:block}
.cell .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fast .n{color:#f77}
select,input{font:inherit}
</style>
<div id="bar">
  <label>Kind <select id="kind"></select></label>
  <label>Beats a minute <input id="bpm" type="range" min="80" max="170" value="124"> <span id="bpmv">124</span></label>
  <label><input id="mir" type="checkbox"> turned the other way</label>
  <label><input id="side" type="checkbox"> from the side</label>
  <span id="count"></span>
</div>
<div id="grid"></div>
<script type="module">
import { MOVES, MV_STYLES, MV_N, flipPose, moveStyle, movePose } from "../js/moves.js";
import { danceBody, danceFlat } from "../js/dance.js";
var BONES=[[0,1],[0,2],[0,3],[2,4],[4,5],[3,6],[6,7],[1,8],[1,9],[8,10],[10,11],[9,12],[12,13],[11,14],[13,15]],cells=[],t0=performance.now();
var kind=document.getElementById("kind"),bpm=document.getElementById("bpm"),mir=document.getElementById("mir"),side=document.getElementById("side"),grid=document.getElementById("grid");
["all"].concat(Object.keys(MV_STYLES)).forEach(function(k){var o=document.createElement("option");o.textContent=k;kind.appendChild(o);});
/* the fastest any joint goes in a move at a speed, in figure heights a second (as tools/unit.mjs measures it) */
function topSpeed(m,per){
  var P=[],J=[],mem=[0,0,0,0,0,0],prev=null,top=0,k,i,n=Math.round(60*per*m.len*2);
  for(k=0;k<=n;k++){movePose(m,k/(60*per),P);danceBody(P,J,mem,1/6);if(prev)for(i=0;i<51;i++)top=Math.max(top,Math.abs(J[i]-prev[i])*60);prev=J.slice();}
  return top;
}
function fill(){
  var per=60/bpm.value;grid.textContent="";cells=[];
  MOVES.forEach(function(m){
    if(kind.value!=="all"&&moveStyle(m)!==kind.value)return;
    var c=document.createElement("div"),cv=document.createElement("canvas"),n=document.createElement("div"),sp=topSpeed(m,per);
    c.className="cell"+(sp>6?" fast":"");cv.width=300;cv.height=300;n.className="n";
    n.textContent=m.name+"  ·  "+m.len+" beats  ·  "+(m.lo?"lo ":"")+(m.mid?"mid ":"")+(m.hi?"hi ":"")+" ·  "+sp.toFixed(1);
    n.title="kind "+moveStyle(m)+"; fastest joint "+sp.toFixed(1)+" figure heights a second at this speed";
    c.appendChild(cv);c.appendChild(n);grid.appendChild(c);
    c.addEventListener("click",function(){c.classList.toggle("big");});
    cells.push({m:m,g:cv.getContext("2d"),mem:[0,0,0,0,0,0],P:new Array(MV_N),J:[],F:[]});
  });
  document.getElementById("count").textContent=cells.length+" moves";document.getElementById("bpmv").textContent=bpm.value;
}
function draw(now){
  var u=(now-t0)/1000*bpm.value/60;
  cells.forEach(function(c){
    var g=c.g,F=c.F,i,X,Y,r=g.canvas.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight){return;} /* only the moves in sight are worked out */
    movePose(c.m,u,c.P);if(mir.checked)flipPose(c.P);if(side.checked)c.P[4]+=1.5707963;
    danceBody(c.P,c.J,c.mem,0.2);danceFlat(c.J,F);
    X=function(k){return 150+F[2*k]*210;};Y=function(k){return 268-F[2*k+1]*210;};
    g.clearRect(0,0,300,300);g.strokeStyle="#333";g.lineWidth=2;g.beginPath();g.moveTo(20,268);g.lineTo(280,268);g.stroke();
    g.lineWidth=7;g.lineCap="round";
    for(i=0;i<BONES.length;i++){g.strokeStyle=(BONES[i][0]===2||BONES[i][1]===4||BONES[i][1]===5||BONES[i][1]===10||BONES[i][1]===11||BONES[i][1]===14)?"#6cf":"#fc6";g.beginPath();g.moveTo(X(BONES[i][0]),Y(BONES[i][0]));g.lineTo(X(BONES[i][1]),Y(BONES[i][1]));g.stroke();}
    g.strokeStyle="#eee";g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(16),Y(16));g.stroke();
    g.fillStyle="#eee";g.beginPath();g.arc(X(16),Y(16),0.075*210*F[34],0,7);g.fill();
    g.fillStyle="#888";g.font="14px sans-serif";g.fillText("beat "+(1+Math.floor(u%c.m.len)),8,18);
  });
  requestAnimationFrame(draw);
}
kind.addEventListener("change",fill);bpm.addEventListener("input",fill);
fill();requestAnimationFrame(draw);
window.movesReady=true;
</script>
