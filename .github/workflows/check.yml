# Runs the checks that need only Node: the pure-logic tests and the pack checker.
# The browser smoke test (tools/check.py) is not run here; run it locally after shader changes.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/unit.mjs
      - run: node tools/pack.mjs   # also fails if packs/index.json is not what tools/gallery.mjs writes
